# MediScan AI Configuration
spring.application.name=mediscan
server.port=${PORT:8080}

# AI Engine Configuration (Supports OpenAI sk-... and Groq gsk_... keys with clinical rule engine fallback)
openai.api.key=${OPENAI_API_KEY:}
groq.api.key=${GROQ_API_KEY:${OPENAI_API_KEY:demo_key}}

# File Upload Limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
