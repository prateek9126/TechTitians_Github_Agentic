# MediScan AI Configuration
spring.application.name=mediscan
server.port=${PORT:8080}

# Groq API Configuration (Optional: if empty or invalid, agent uses clinical generative fallback)
groq.api.key=${GROQ_API_KEY:demo_key}

# File Upload Limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
